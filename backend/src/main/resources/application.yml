spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dbdesigndrill
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false

app:
  aws:
    region: ${AWS_REGION:ap-northeast-1}
  lambda:
    function-name: ${LAMBDA_FUNCTION_NAME:db-design-drill-ai}
    stub-mode: ${LAMBDA_STUB_MODE:false}

logging:
  level:
    com.nut753908.dbdesigndrill: DEBUG
