<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>履歴一覧 - DB設計ドリル</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header><h1><a th:href="@{/history}">DB設計ドリル</a></h1></header>
<main>
<h2>お題の履歴</h2>
<p><a th:href="@{/problems/new}">新しいお題を作成する</a></p>
<table>
  <thead>
    <tr><th>作成日時</th><th>ジャンル</th><th>難易度</th><th></th></tr>
  </thead>
  <tbody>
    <tr th:each="p : ${problems}">
      <td th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
      <td th:text="${p.genre.label}"></td>
      <td th:text="${p.difficulty.label}"></td>
      <td><a th:href="@{/problems/{id}(id=${p.id})}">詳細</a></td>
    </tr>
  </tbody>
</table>
<p th:if="${#lists.isEmpty(problems)}">まだお題がありません</p>
</main>
</body>
</html>
